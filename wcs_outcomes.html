<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WCS Charge Outcomes Over Time</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="viz-container">
    <div class="viz-header">
      <div class="viz-kicker">Signal Cleveland</div>
      <div class="viz-heading">How outcomes for body camera charges have changed over time</div>
      <div class="viz-subheading">Body camera charges peaked in 2021 with suspensions making up a majority of outcomes. Since 2022, non-disciplinary reinstructions have surged — accounting for nearly half of all outcomes in 2023.</div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="chart-area">
      <svg class="chart-svg" id="chart" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <!-- Tooltip lives outside the container so fixed positioning works cleanly -->
  <div class="bar-tooltip" id="tooltip"></div>

  <script>
    // Ordered largest-total-first (drawn at the base of the stack, smallest
    // on top) so the categories driving year-to-year variation are easiest to read.
    const CATEGORIES = [
      { key: "Suspension",       color: "#23685b" },
      { key: "Reinstruction",    color: "#a9d2cf" },
      { key: "Written Reprimand", color: "#5fa896" },
      { key: "Charge Dropped",   color: "#dbe7e3" },
      { key: "Resignation",      color: "#e56430" },
      { key: "Termination",      color: "#d64d4d" },
      { key: "Demotion",         color: "#e6a94d" },
    ];

    // Verbal Warning (1 case, 2023) folded into Reinstruction
    const DATA = [
      { year: 2017, "Termination": 1, "Resignation": 0, "Demotion": 0, "Suspension": 5,  "Written Reprimand": 2,  "Reinstruction": 7,  "Charge Dropped": 2 },
      { year: 2018, "Termination": 0, "Resignation": 0, "Demotion": 0, "Suspension": 14, "Written Reprimand": 13, "Reinstruction": 5,  "Charge Dropped": 0 },
      { year: 2019, "Termination": 0, "Resignation": 0, "Demotion": 0, "Suspension": 34, "Written Reprimand": 2,  "Reinstruction": 4,  "Charge Dropped": 2 },
      { year: 2020, "Termination": 0, "Resignation": 1, "Demotion": 0, "Suspension": 41, "Written Reprimand": 4,  "Reinstruction": 14, "Charge Dropped": 4 },
      { year: 2021, "Termination": 1, "Resignation": 1, "Demotion": 1, "Suspension": 60, "Written Reprimand": 11, "Reinstruction": 3,  "Charge Dropped": 8 },
      { year: 2022, "Termination": 0, "Resignation": 1, "Demotion": 0, "Suspension": 19, "Written Reprimand": 3,  "Reinstruction": 15, "Charge Dropped": 0 },
      { year: 2023, "Termination": 1, "Resignation": 4, "Demotion": 1, "Suspension": 19, "Written Reprimand": 7,  "Reinstruction": 30, "Charge Dropped": 1 },
      { year: 2024, "Termination": 0, "Resignation": 2, "Demotion": 0, "Suspension": 11, "Written Reprimand": 5,  "Reinstruction": 5,  "Charge Dropped": 0 },
      { year: 2025, "Termination": 0, "Resignation": 0, "Demotion": 0, "Suspension": 4,  "Written Reprimand": 2,  "Reinstruction": 2,  "Charge Dropped": 0 },
    ];

    const W = 800, H = 340;
    const m = { top: 12, right: 20, bottom: 44, left: 48 };
    const plotW = W - m.left - m.right;
    const plotH = H - m.top - m.bottom;
    const MAX_Y = 90;
    const Y_TICKS = [0, 15, 30, 45, 60, 75, 90];

    const ns = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("chart");

    function svgEl(tag, attrs) {
      const e = document.createElementNS(ns, tag);
      if (attrs) Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
      return e;
    }

    const n = DATA.length;
    const groupW = plotW / n;
    const barW = groupW * 0.62;

    function xCenter(i) { return m.left + i * groupW + groupW / 2; }
    function yPx(v)      { return m.top + plotH - (v / MAX_Y) * plotH; }

    // Gridlines + Y tick labels
    Y_TICKS.forEach(tick => {
      const y = yPx(tick);
      svg.appendChild(svgEl("line", {
        class: "gridline",
        x1: m.left, x2: m.left + plotW,
        y1: y, y2: y,
      }));
      const label = svgEl("text", {
        class: "ytick",
        x: m.left - 8, y,
        "text-anchor": "end",
        "dominant-baseline": "middle",
      });
      label.textContent = tick;
      svg.appendChild(label);
    });

    // Tooltip
    const tooltip = document.getElementById("tooltip");

    // Bars
    DATA.forEach((d, i) => {
      const cx = xCenter(i);
      const x = cx - barW / 2;
      const total = CATEGORIES.reduce((s, c) => s + (d[c.key] || 0), 0);

      let cumY = 0;
      CATEGORIES.forEach(({ key, color }) => {
        const val = d[key] || 0;
        if (val === 0) return;
        const barH = (val / MAX_Y) * plotH;
        const y = yPx(cumY + val);

        const rect = svgEl("rect", {
          class: "seg",
          x, y,
          width: barW,
          height: barH,
          fill: color,
        });
        rect.dataset.cat = key;
        rect.dataset.group = key;
        rect.dataset.finalY = y;
        rect.dataset.finalHeight = barH;

        rect.addEventListener("mouseenter", () => {
          tooltip.innerHTML =
            `<span class="tt-title">${d.year} — ${key}</span>` +
            `<span class="tt-total">Total that year: ${total}</span>` +
            `<div class="tt-row">` +
              `<span class="tt-bar-swatch" style="background:${color}"></span>` +
              `<span class="tt-label">${key}</span>` +
              `<span class="tt-count">${val} case${val !== 1 ? "s" : ""}</span>` +
            `</div>`;
          tooltip.classList.add("visible");
        });
        rect.addEventListener("mousemove", e => {
          tooltip.style.left = (e.clientX + 14) + "px";
          tooltip.style.top  = (e.clientY - 36) + "px";
        });
        rect.addEventListener("mouseleave", () => {
          tooltip.classList.remove("visible");
        });

        svg.appendChild(rect);
        cumY += val;
      });

      // Total label above the stack
      const totalLabel = svgEl("text", {
        class: "col-total",
        x: cx,
        y: yPx(cumY) - 6,
        "text-anchor": "middle",
      });
      totalLabel.textContent = total;
      svg.appendChild(totalLabel);

      // X axis year label
      const label = svgEl("text", {
        class: "axis-text",
        x: cx,
        y: yPx(0) + 13,
        "text-anchor": "middle",
        "dominant-baseline": "hanging",
      });
      label.textContent = d.year;
      svg.appendChild(label);
    });

    // Legend (clickable filter)
    const legendEl = document.getElementById("legend");
    let activeFilter = null;

    CATEGORIES.forEach(({ key, color }) => {
      const total = DATA.reduce((sum, d) => sum + (d[key] || 0), 0);
      const chip = document.createElement("div");
      chip.className = "legend-chip";
      chip.dataset.key = key;
      chip.style.setProperty("--chip-color", color);
      chip.innerHTML = `<span class="lg-dot" style="background:${color}"></span>${key}<span class="lg-count">${total}</span>`;
      chip.addEventListener("click", () => {
        activeFilter === key ? clearFilter() : setFilter(key);
      });
      legendEl.appendChild(chip);
    });

    function setFilter(key) {
      activeFilter = key;
      legendEl.querySelectorAll(".legend-chip").forEach(chip => {
        const isActive = chip.dataset.key === key;
        chip.classList.toggle("solo", isActive);
        chip.classList.toggle("muted", !isActive);
      });
      svg.querySelectorAll(".seg").forEach(r => {
        r.classList.toggle("dim", r.dataset.cat !== key);
      });
    }

    function clearFilter() {
      activeFilter = null;
      legendEl.querySelectorAll(".legend-chip").forEach(chip => {
        chip.classList.remove("solo", "muted");
      });
      svg.querySelectorAll(".seg").forEach(r => r.classList.remove("dim"));
    }

    // ── Bar entrance animation ──────────────────────────────────
    const STAGGER_ORDER  = CATEGORIES.map(c => c.key);
    const STAGGER_STEP   = 0;   // ms delay between each stacked layer starting
    const SEG_DURATION   = 700; // ms duration of each segment's own grow-in
    const TOTAL_DURATION = STAGGER_STEP * (STAGGER_ORDER.length - 1) + SEG_DURATION + 250;
    const ease = t => 1 - Math.pow(1 - t, 3);
    let animGen = 0;

    function hideBars() {
      const baseline = yPx(0);
      svg.querySelectorAll(".seg").forEach(rect => {
        rect.setAttribute("y", baseline);
        rect.setAttribute("height", 0);
      });
      svg.querySelectorAll(".col-total").forEach(l => l.setAttribute("opacity", "0"));
    }

    function animateBars() {
      const gen = ++animGen;
      const baseline = yPx(0);
      const start = performance.now();

      svg.querySelectorAll(".seg").forEach(rect => {
        const finalY = parseFloat(rect.dataset.finalY);
        const finalH = parseFloat(rect.dataset.finalHeight);
        const delay  = STAGGER_ORDER.indexOf(rect.dataset.group) * STAGGER_STEP;
        rect.setAttribute("y", baseline);
        rect.setAttribute("height", 0);
        function frame(now) {
          if (gen !== animGen) return;
          const elapsed = now - start - delay;
          if (elapsed < 0) { requestAnimationFrame(frame); return; }
          const t = Math.min(elapsed / SEG_DURATION, 1);
          const e = ease(t);
          rect.setAttribute("height", Math.max(finalH * e, 0));
          rect.setAttribute("y", baseline + (finalY - baseline) * e);
          if (t < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      });

      const totals = Array.from(svg.querySelectorAll(".col-total"));
      totals.forEach(l => l.setAttribute("opacity", "0"));
      const labelStart = 0.75;
      function labelFrame(now) {
        if (gen !== animGen) return;
        const t = Math.min((now - start) / TOTAL_DURATION, 1);
        const op = Math.max(0, Math.min(1, (t - labelStart) / (1 - labelStart)));
        totals.forEach(l => l.setAttribute("opacity", op));
        if (t < 1) requestAnimationFrame(labelFrame);
      }
      requestAnimationFrame(labelFrame);
    }

    const chartAreaSentinel = document.createElement("div");
    chartAreaSentinel.style.cssText = "position:absolute;bottom:0;left:0;width:1px;height:1px;pointer-events:none;";
    document.querySelector(".chart-area").appendChild(chartAreaSentinel);

    let chartAnimated = false;
    const barObserver = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting && !chartAnimated) {
        chartAnimated = true;
        animateBars();
      }
    }, { threshold: 0 });

    hideBars();
    barObserver.observe(chartAreaSentinel);
  </script>
  <script>
    /* Auto-height embed messaging (self-contained replacement for pym.js — NPR CDN retired) */
    (function () {
      function postHeight() {
        var el = document.querySelector('.viz-container');
        var h = el ? Math.ceil(el.getBoundingClientRect().bottom + 32) : document.body.scrollHeight;
        window.parent.postMessage({ type: 'embed-height', height: h }, '*');
      }
      window.addEventListener('load', postHeight);
      window.addEventListener('resize', postHeight);
      setInterval(postHeight, 500);
    })();
  </script>
</body>
</html>
